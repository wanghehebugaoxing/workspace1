<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="超能宝宝的小站 - 记录技术与生活的小角落">
<title>超能宝宝的小站</title>
<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff;
  --border:#e8eaf2;
  --text:#2b2f3a;
  --text-2:#7a8194;
  --text-3:#a3a9bb;
  --primary:#5b6ef5;
  --primary-2:#8b5cf6;
  --grad:linear-gradient(135deg,#5b6ef5 0%,#8b5cf6 100%);
  --grad-soft:linear-gradient(135deg,rgba(91,110,245,.08),rgba(139,92,246,.08));
  --danger:#ef4444;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 2px 10px rgba(43,47,58,.05);
  --shadow-md:0 8px 24px rgba(43,47,58,.09);
  --shadow-lg:0 16px 40px rgba(43,47,58,.13);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
button{font-family:inherit}
::selection{background:rgba(91,110,245,.2)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9cede;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#aeb4c9}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶部导航 ===== */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,234,242,.9);transition:box-shadow .25s}
.header.scrolled{box-shadow:0 4px 20px rgba(43,47,58,.07)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;flex-shrink:0}
.logo .logo-badge{width:36px;height:36px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 12px rgba(91,110,245,.35)}
.logo .logo-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a{padding:7px 15px;border-radius:20px;font-size:14.5px;color:var(--text-2);transition:all .18s;position:relative}
.nav a:hover{color:var(--text);background:rgba(91,110,245,.07)}
.nav a.active{color:#fff;background:var(--grad);box-shadow:0 4px 12px rgba(91,110,245,.3);font-weight:500}
.nav .nav-admin{margin-left:8px;display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:13px}
.nav .nav-admin:hover{color:var(--primary)}
.menu-btn{display:none;margin-left:auto;width:40px;height:40px;border:none;background:transparent;border-radius:10px;cursor:pointer;color:var(--text);font-size:20px}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;z-index:99;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px 16px;box-shadow:var(--shadow-md)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 16px;border-radius:10px;color:var(--text-2);font-size:15px}
.mobile-menu a.active{color:var(--primary);background:rgba(91,110,245,.08);font-weight:600}

/* ===== 通用布局 ===== */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.main{padding-top:64px;min-height:calc(100vh - 200px)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;padding:28px 0 48px;align-items:start}
.page-title-row{display:flex;align-items:center;gap:12px;margin:32px 0 4px}
.page-title-row h2{font-size:24px;font-weight:700}
.page-title-row .count-chip{font-size:12.5px;color:var(--primary);background:rgba(91,110,245,.1);padding:3px 10px;border-radius:12px;font-weight:600}
.page-desc{color:var(--text-2);font-size:14px;margin-bottom:20px}

/* ===== Hero ===== */
.hero{position:relative;min-height:78vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#eef0fb 0%,#f5f6fa 100%)}
.hero-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(91,110,245,.12) 1.5px,transparent 1.5px);background-size:26px 26px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 30%,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:blobFloat 9s ease-in-out infinite}
.blob-1{width:340px;height:340px;background:#c7d0ff;top:-80px;left:-60px}
.blob-2{width:280px;height:280px;background:#e8cfff;bottom:-60px;right:-40px;animation-delay:-3s}
.blob-3{width:200px;height:200px;background:#ffd9e8;top:30%;right:18%;animation-delay:-6s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-20px) scale(1.06)}}
.hero-inner{position:relative;text-align:center;padding:70px 24px 90px;max-width:760px}
.hero-avatar{width:104px;height:104px;margin:0 auto 22px;border-radius:50%;background:var(--grad);padding:4px;box-shadow:0 12px 32px rgba(91,110,245,.35);animation:floatY 5s ease-in-out infinite}
.hero-avatar .inner{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:52px}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-title{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:.5px;margin-bottom:14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(15px,2.4vw,18px);color:var(--text-2);min-height:30px;margin-bottom:28px}
.hero-sub .cursor{display:inline-block;width:2px;height:1.1em;background:var(--primary);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-socials{display:flex;justify-content:center;gap:12px;margin-bottom:34px}
.hero-socials a{padding:8px 20px;border-radius:22px;background:#fff;border:1px solid var(--border);font-size:13.5px;color:var(--text-2);box-shadow:var(--shadow);transition:all .2s}
.hero-socials a:hover{color:var(--primary);border-color:rgba(91,110,245,.4);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.hero-stats{display:flex;justify-content:center;gap:0;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid rgba(232,234,242,.8);border-radius:var(--radius);padding:16px 10px;max-width:480px;margin:0 auto;box-shadow:var(--shadow)}
.hero-stats .stat{flex:1;text-align:center;cursor:pointer;transition:transform .2s}
.hero-stats .stat:hover{transform:translateY(-2px)}
.hero-stats .stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stats .stat span{font-size:12.5px;color:var(--text-2)}
.hero-stats .stat+.stat{border-left:1px solid var(--border)}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:var(--text-3);animation:bounceDown 2s infinite;font-size:22px;cursor:pointer}
@keyframes bounceDown{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}

/* ===== 精选轮播 ===== */
.section{margin:44px 0}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.section-head .bar{width:5px;height:22px;border-radius:3px;background:var(--grad)}
.section-head h3{font-size:21px;font-weight:700}
.section-head .more{margin-left:auto;font-size:13.5px;color:var(--text-3);transition:color .2s}
.section-head .more:hover{color:var(--primary)}
.carousel{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-md)}
.carousel-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.carousel-item{min-width:100%;position:relative;height:380px;display:flex;align-items:flex-end;cursor:pointer}
.carousel-cover{position:absolute;inset:0}
.carousel-cover .cc-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.carousel-item .cc-body{position:relative;width:100%;padding:34px 38px;background:linear-gradient(180deg,transparent 0%,rgba(15,17,26,.62) 78%);color:#fff}
.cc-chip{display:inline-block;font-size:12px;padding:3px 12px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);margin-bottom:10px}
.cc-body h4{font-size:26px;font-weight:700;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.cc-body p{font-size:14px;opacity:.88;max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-emoji{position:absolute;top:36px;right:44px;font-size:96px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25));animation:floatY 6s ease-in-out infinite}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);cursor:pointer;font-size:17px;color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .2s;z-index:2}
.carousel-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.carousel-arrow.prev{left:16px}
.carousel-arrow.next{right:16px}
.carousel-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.carousel-dots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.5);cursor:pointer;transition:all .25s}
.carousel-dots span.active{width:24px;background:#fff}

/* ===== 文章卡片 ===== */
.article-card{display:flex;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;transition:all .25s;cursor:pointer;border:1px solid rgba(232,234,242,.6)}
.article-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:rgba(91,110,245,.25)}
.article-card .ac-cover{width:235px;min-height:172px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ac-cover .ac-emoji{font-size:58px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18));transition:transform .3s;z-index:1}
.article-card:hover .ac-emoji{transform:scale(1.15) rotate(-4deg)}
.ac-cover .ac-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.article-card .ac-body{padding:20px 22px;flex:1;display:flex;flex-direction:column;min-width:0}
.ac-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ac-cat{font-size:12px;color:var(--primary);background:rgba(91,110,245,.1);padding:2px 11px;border-radius:11px;font-weight:600;flex-shrink:0}
.ac-date{font-size:12.5px;color:var(--text-3)}
.article-card h4{font-size:17.5px;font-weight:700;margin-bottom:8px;transition:color .2s;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.article-card:hover h4{color:var(--primary)}
.ac-summary{font-size:13.8px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;flex:1}
.ac-meta{display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.ac-meta .m-item{display:flex;align-items:center;gap:4px}
.ac-tags{display:flex;gap:6px;flex-wrap:wrap}
.ac-tags .t{font-size:11.5px;padding:1px 9px;border-radius:9px;background:var(--bg);color:var(--text-2);transition:all .18s}
.ac-tags .t:hover{color:var(--primary);background:rgba(91,110,245,.09)}

/* ===== 侧边栏 ===== */
.sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:20px}
.side-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid rgba(232,234,242,.6)}
.side-card h5{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.side-card h5::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--grad)}
.blogger{display:flex;flex-direction:column;align-items:center;text-align:center}
.blogger .b-avatar{width:84px;height:84px;border-radius:50%;background:var(--grad);padding:3px;margin-bottom:12px}
.blogger .b-avatar .inner{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px}
.blogger .b-name{font-size:17px;font-weight:700;margin-bottom:4px}
.blogger .b-sign{font-size:13px;color:var(--text-2);margin-bottom:16px}
.b-stats{display:grid;grid-template-columns:repeat(4,1fr);width:100%;border-top:1px solid var(--border);padding-top:14px}
.b-stats .s{text-align:center;cursor:pointer}
.b-stats .s b{display:block;font-size:17px;color:var(--primary)}
.b-stats .s span{font-size:11.5px;color:var(--text-3)}
.hot-list{list-style:none}
.hot-list li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--border);cursor:pointer}
.hot-list li:last-child{border-bottom:none;padding-bottom:2px}
.hot-list li:hover .h-title{color:var(--primary)}
.hot-list .h-rank{width:22px;height:22px;border-radius:7px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);color:var(--text-3)}
.hot-list li:nth-child(1) .h-rank{background:linear-gradient(135deg,#ff7a59,#ff4d6d);color:#fff}
.hot-list li:nth-child(2) .h-rank{background:linear-gradient(135deg,#ffb020,#ff8800);color:#fff}
.hot-list li:nth-child(3) .h-rank{background:linear-gradient(135deg,#5b6ef5,#8b5cf6);color:#fff}
.hot-list .h-title{font-size:13.5px;flex:1;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
.hot-list .h-views{font-size:11.5px;color:var(--text-3);flex-shrink:0}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud .tc{font-size:12.5px;padding:4px 13px;border-radius:15px;background:var(--bg);color:var(--text-2);transition:all .2s;cursor:pointer}
.tag-cloud .tc:hover{background:var(--grad);color:#fff;transform:translateY(-2px);box-shadow:0 4px 10px rgba(91,110,245,.3)}

/* ===== 工具条（文章列表页） ===== */
.toolbar{display:flex;gap:12px;margin:18px 0 22px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{width:100%;padding:11px 38px 11px 40px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:all .2s}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,110,245,.12)}
.search-box .s-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap}
.filter-chips .fc{padding:8px 16px;border-radius:20px;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .2s}
.filter-chips .fc:hover{color:var(--primary);border-color:rgba(91,110,245,.4)}
.filter-chips .fc.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(91,110,245,.3)}

/* ===== 文章详情 ===== */
.article-page{max-width:840px;margin:0 auto;padding:36px 24px 60px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);padding:7px 16px;border-radius:18px;background:var(--card);border:1px solid var(--border);cursor:pointer;margin-bottom:22px;transition:all .2s}
.back-btn:hover{color:var(--primary);border-color:rgba(91,110,245,.4)}
.detail-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden;border:1px solid rgba(232,234,242,.6)}
.detail-banner{height:230px;position:relative;display:flex;align-items:center;justify-content:center}
.detail-banner .d-emoji{font-size:88px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.22));animation:floatY 6s ease-in-out infinite}
.detail-banner .d-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.15)}
.detail-body{padding:34px 42px 40px}
.detail-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-3);margin-bottom:8px;flex-wrap:wrap}
.detail-meta .d-cat{color:var(--primary);background:rgba(91,110,245,.1);padding:2px 12px;border-radius:11px;font-weight:600}
.detail-body h1{font-size:27px;font-weight:800;line-height:1.4;margin-bottom:10px}
.detail-tags{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.detail-tags .t{font-size:12px;padding:3px 12px;border-radius:12px;background:var(--bg);color:var(--text-2)}
.detail-nav{display:flex;gap:12px;margin-top:30px;padding-top:24px;border-top:1px solid var(--border)}
.detail-nav a{flex:1;padding:14px 18px;border-radius:12px;background:var(--bg);transition:all .2s;min-width:0}
.detail-nav a:hover{background:rgba(91,110,245,.07)}
.detail-nav .dn-label{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.detail-nav .dn-title{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Markdown 渲染 ===== */
.md{font-size:15.5px;color:#373c4a}
.md h1,.md h2,.md h3,.md h4{margin:1.5em 0 .7em;font-weight:700;line-height:1.45;color:var(--text)}
.md h1{font-size:23px;padding-left:14px;border-left:4px solid;border-image:var(--grad) 1}
.md h2{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.md h3{font-size:17.5px}
.md p{margin:.85em 0}
.md a{color:var(--primary);border-bottom:1px dashed rgba(91,110,245,.5)}
.md a:hover{border-bottom-style:solid}
.md strong{color:var(--text)}
.md ul,.md ol{margin:.85em 0;padding-left:1.7em}
.md li{margin:.35em 0}
.md blockquote{margin:1.1em 0;padding:12px 18px;background:var(--grad-soft);border-left:4px solid var(--primary);border-radius:0 10px 10px 0;color:var(--text-2)}
.md blockquote p{margin:.3em 0}
.md code:not(pre code){background:rgba(91,110,245,.09);color:#4c5195;padding:2px 7px;border-radius:6px;font-size:88%;font-family:var(--mono)}
.md pre{background:#23263b;color:#e6e9f5;border-radius:12px;padding:18px 20px;overflow-x:auto;margin:1.1em 0;font-size:13.5px;line-height:1.65}
.md pre code{font-family:var(--mono)}
.md table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:13.8px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.md th{background:var(--grad);color:#fff;font-weight:600}
.md th,.md td{padding:10px 14px;text-align:left;border:none}
.md tr:nth-child(even) td{background:#f8f9fd}
.md hr{border:none;height:1px;background:var(--border);margin:1.8em 0}
.md img{border-radius:10px;box-shadow:var(--shadow)}

/* ===== 留言墙 ===== */
.message-wall{columns:3;column-gap:18px;padding-bottom:50px}
.msg-card{break-inside:avoid;background:var(--card);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid rgba(232,234,242,.6);transition:all .25s}
.msg-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.msg-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.msg-ava{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.msg-name{font-size:14.5px;font-weight:700}
.msg-date{font-size:12px;color:var(--text-3)}
.msg-content{font-size:14px;color:var(--text-2);line-height:1.75}
.msg-empty{text-align:center;color:var(--text-3);padding:60px 0;font-size:14px}

/* ===== 关于页 ===== */
.about-wrap{max-width:840px;margin:0 auto;padding:36px 24px 60px}
.about-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:38px 42px;border:1px solid rgba(232,234,242,.6)}
.about-hero{display:flex;align-items:center;gap:24px;margin-bottom:28px}
.about-hero .a-ava{width:96px;height:96px;border-radius:50%;background:var(--grad);padding:3px;flex-shrink:0}
.about-hero .a-ava .inner{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px}
.about-hero h2{font-size:24px;font-weight:800;margin-bottom:6px}
.about-hero p{color:var(--text-2);font-size:14px}
.about-section{margin-top:26px}

<script>
/* ================= 工具 ================= */
const GRADS = [
  ['#6366f1','#8b5cf6'],['#06b6d4','#3b82f6'],['#f472b6','#fb7185'],['#f59e0b','#f97316'],
  ['#10b981','#14b8a6'],['#8b5cf6','#ec4899'],['#0ea5e9','#22d3ee'],['#84cc16','#22c55e']
];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}
function gradOf(key){const g=GRADS[hashStr(String(key))%GRADS.length];return 'linear-gradient(135deg,'+g[0]+' 0%,'+g[1]+' 100%)'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日'}
function debounce(fn,ms){let t=null;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms)}}

/* ================= Markdown 解析 ================= */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s;
}
function mdToHtml(src){
  if(!src) return '';
  const codeBlocks = [];
  src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codeBlocks.push({lang,code});
    return '\u0001CB'+(codeBlocks.length-1)+'\u0001';
  });
  const lines = src.split('\n');
  let html='', inUl=false, inOl=false, inQuote=false, inTable=false, tableRows=[];
  const closeList=()=>{ if(inUl){html+='</ul>';inUl=false} if(inOl){html+='</ol>';inOl=false} };
  const closeQuote=()=>{ if(inQuote){html+='</blockquote>';inQuote=false} };
  const closeTable=()=>{
    if(!inTable)return;
    let t='<table><thead><tr>';
    tableRows[0].forEach(c=>t+='<th>'+inlineMd(c)+'</th>');
    t+='</tr></thead><tbody>';
    for(let i=1;i<tableRows.length;i++){t+='<tr>';tableRows[i].forEach(c=>t+='<td>'+inlineMd(c)+'</td>');t+='</tr>'}
    t+='</tbody></table>'; html+=t; inTable=false; tableRows=[];
  };
  const flushPara=(buf)=>{ if(buf.length) html+='<p>'+inlineMd(buf.join(' '))+'</p>'; };
  let para=[];
  const flushP=()=>{flushPara(para);para=[]};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const cbMatch=line.match(/^\u0001CB(\d+)\u0001\s*$/);
    if(cbMatch){flushP();closeList();closeQuote();closeTable();const b=codeBlocks[+cbMatch[1]];html+='<pre><code>'+esc(b.code.replace(/\n$/,''))+'</code></pre>';continue}
    if(/^\s*$/.test(line)){flushP();closeList();closeQuote();closeTable();continue}
    if(/^\|(.+)\|\s*$/.test(line)){
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))){continue}
      if(!inTable){flushP();closeList();closeQuote();inTable=true;tableRows=[]}
      tableRows.push(cells);continue;
    }else{closeTable()}
    const h=line.match(/^(#{1,4})\s+(.*)/);
    if(h){flushP();closeList();closeQuote();const lv=h[1].length;html+='<h'+lv+'>'+inlineMd(h[2])+'</h'+lv+'>';continue}
    if(/^>\s?/.test(line)){flushP();closeList();if(!inQuote){html+='<blockquote>';inQuote=true}html+='<p>'+inlineMd(line.replace(/^>\s?/,''))+'</p>';continue}
    closeQuote();
    if(/^[-*]\s+/.test(line)){flushP();if(inOl){html+='</ol>';inOl=false}if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}
    if(/^\d+\.\s+/.test(line)){flushP();if(inUl){html+='</ul>';inUl=false}if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inlineMd(line.replace(/^\d+\.\s+/,''))+'</li>';continue}
    if(/^(---|\*\*\*)\s*$/.test(line)){flushP();closeList();html+='<hr>';continue}
    closeList();
    para.push(line.trim());
  }
  flushP();closeList();closeQuote();closeTable();
  return html;
}

/* ================= 数据与状态 ================= */
let DATA = null;
const app = document.getElementById('app');
const byId = {
  cat:id=>(DATA.categories||[]).find(c=>c.id===id),
  tag:id=>(DATA.tags||[]).find(t=>t.id===id),
  article:id=>(DATA.articles||[]).find(a=>a.id===id)
};
const pubArticles = ()=> (DATA.articles||[]).filter(a=>a.published!==false).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

/* 装饰圆点 */
function decoSpots(seed){
  const h=hashStr(seed);
  return '<span class="cc-deco" style="width:'+(90+h%60)+'px;height:'+(90+h%60)+'px;top:'+(h%30)+'%;left:'+(h%40)+'%"></span>'+
         '<span class="cc-deco" style="width:'+(40+h%30)+'px;height:'+(40+h%30)+'px;bottom:'+(h%25)+'%;right:'+(h%35)+'%"></span>';
}

/* ================= 页面渲染 ================= */
function renderHome(){
  const site=DATA.site||{}, arts=pubArticles(), featured=arts.filter(a=>a.featured).slice(0,4);
  const hot=[...arts].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
  const totalViews=arts.reduce((s,a)=>s+(a.views||0),0);
  document.title=site.title||'小站';
  app.innerHTML=`
  <section class="hero">
    <div class="hero-bg"></div>
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
    <div class="hero-inner">
      <div class="hero-avatar"><div class="inner">${esc(site.avatar||'🐣')}</div></div>
      <h1 class="hero-title">${esc(site.title||'我的小站')}</h1>
      <p class="hero-sub"><span id="typewriter"></span><span class="cursor"></span></p>
      <div class="hero-socials" id="heroSocials"></div>
      <div class="hero-stats">
        <div class="stat" onclick="location.hash='#/articles'"><b>${arts.length}</b><span>文章</span></div>
        <div class="stat" onclick="location.hash='#/categories'"><b>${(DATA.categories||[]).length}</b><span>分类</span></div>
        <div class="stat" onclick="location.hash='#/articles'"><b>${(DATA.tags||[]).length}</b><span>标签</span></div>
        <div class="stat" onclick="location.hash='#/messages'"><b>${(DATA.messages||[]).length}</b><span>留言</span></div>
      </div>
    </div>
    <span class="scroll-hint" onclick="document.querySelector('.section').scrollIntoView({behavior:'smooth'})">⌄</span>
  </section>
  <div class="container">
    ${featured.length?`
    <section class="section reveal">
      <div class="section-head"><span class="bar"></span><h3>🎯 精选推荐</h3><a class="more" href="#/articles">查看全部 →</a></div>
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack">
          ${featured.map(a=>`
          <div class="carousel-item" onclick="location.hash='#/article/${a.id}'">
            <div class="carousel-cover" style="background:${gradOf(a.id)}">${decoSpots(a.id)}</div>
            <span class="cc-emoji">${esc(a.cover||'📄')}</span>
            <div class="cc-body">
              <span class="cc-chip">${esc(byId.cat(a.categoryId)?.name||'随笔')}</span>
              <h4>${esc(a.title)}</h4>
              <p>${esc(a.summary||'')}</p>
            </div>
          </div>`).join('')}
        </div>
        <button class="carousel-arrow prev" onclick="carouselMove(-1)" aria-label="上一张">‹</button>
        <button class="carousel-arrow next" onclick="carouselMove(1)" aria-label="下一张">›</button>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
    </section>`:''}
    <section class="section reveal">
      <div class="section-head"><span class="bar"></span><h3>📝 最新文章</h3><a class="more" href="#/articles">更多文章 →</a></div>
      <div class="layout">
        <div>${arts.slice(0,6).map(articleCard).join('')||emptyBox('还没有文章')}</div>
        ${sidebarHTML(hot)}
      </div>
    </section>
  </div>`;
  renderSocials(site);
  startTypewriter(site.subtitle||'记录技术与生活');
  if(featured.length) initCarousel(featured.length);
  observeReveal();
}

function articleCard(a){
  const cat=byId.cat(a.categoryId);
  const tags=(a.tagIds||[]).map(id=>byId.tag(id)).filter(Boolean);
  return `
  <article class="article-card" onclick="location.hash='#/article/${a.id}'">
    <div class="ac-cover" style="background:${gradOf(a.id)}">${decoSpots(a.id)}<span class="ac-emoji">${esc(a.cover||'📄')}</span></div>
    <div class="ac-body">
      <div class="ac-top"><span class="ac-cat">${esc(cat?cat.name:'随笔')}</span><span class="ac-date">${fmtDate(a.createdAt)}</span></div>
      <h4>${esc(a.title)}</h4>
      <p class="ac-summary">${esc(a.summary||'')}</p>
      <div class="ac-meta">
        <span class="m-item">👁 ${(a.views||0)}</span>
        <span class="m-item">💬 ${(a.tagIds||[]).length} 个标签</span>
        <span class="ac-tags">${tags.map(t=>`<span class="t" onclick="event.stopPropagation();location.hash='#/tag/${t.id}'">${esc(t.name)}</span>`).join('')}</span>
      </div>
    </div>
  </article>`;
}

function sidebarHTML(hot){
  const site=DATA.site||{};
  return `
  <aside class="sidebar">
    <div class="side-card blogger">
      <div class="b-avatar"><div class="inner">${esc(site.avatar||'🐣')}</div></div>
      <div class="b-name">${esc(site.title||'博主')}</div>
      <div class="b-sign">${esc(site.signature||'')}</div>
      <div class="b-stats">
        <div class="s" onclick="location.hash='#/articles'"><b>${pubArticles().length}</b><span>文章</span></div>
        <div class="s" onclick="location.hash='#/categories'"><b>${(DATA.categories||[]).length}</b><span>分类</span></div>
        <div class="s" onclick="location.hash='#/articles'"><b>${(DATA.tags||[]).length}</b><span>标签</span></div>
        <div class="s" onclick="location.hash='#/messages'"><b>${(DATA.messages||[]).length}</b><span>留言</span></div>
      </div>
    </div>
    <div class="side-card">
      <h5>🔥 热门文章</h5>
      <ul class="hot-list">
        ${(hot||[]).map((a,i)=>`
        <li onclick="location.hash='#/article/${a.id}'">
          <span class="h-rank">${i+1}</span>
          <span class="h-title">${esc(a.title)}</span>
          <span class="h-views">👁${a.views||0}</span>
        </li>`).join('')}
      </ul>
    </div>
    <div class="side-card">
      <h5>🏷️ 标签云</h5>
      <div class="tag-cloud">
        ${(DATA.tags||[]).map(t=>`<span class="tc" onclick="location.hash='#/tag/${t.id}'"># ${esc(t.name)}</span>`).join('')}
      </div>
    </div>
  </aside>`;
}

function renderArticles(){
  const arts=pubArticles();
  app.innerHTML=`
  <div class="container">
    <div class="page-title-row"><h2>📄 全部文章</h2><span class="count-chip">${arts.length} 篇</span></div>
    <p class="page-desc">共 ${arts.length} 篇文章，累计阅读 ${arts.reduce((s,a)=>s+(a.views||0),0)} 次</p>
    <div class="toolbar">
      <div class="search-box"><span class="s-icon">🔍</span><input id="artSearch" type="search" placeholder="搜索文章标题或摘要…"></div>
      <div class="filter-chips" id="catFilter">
        <span class="fc active" data-cat="">全部</span>
        ${(DATA.categories||[]).map(c=>`<span class="fc" data-cat="${c.id}">${esc(c.name)}</span>`).join('')}
      </div>
    </div>
    <div class="layout">
      <div id="artList">${arts.map(articleCard).join('')}</div>
      ${sidebarHTML([...arts].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5))}
    </div>
  </div>`;
  const search=document.getElementById('artSearch');
  let curCat='';
  const refresh=()=>{
    const q=(search.value||'').trim().toLowerCase();
    const list=arts.filter(a=>(!curCat||a.categoryId===curCat)&&(!q||(a.title||'').toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)));
    document.getElementById('artList').innerHTML=list.map(articleCard).join('')||emptyBox('没有找到相关文章');
  };
  search.addEventListener('input',debounce(refresh,250));
  document.getElementById('catFilter').addEventListener('click',e=>{
    const fc=e.target.closest('.fc'); if(!fc)return;
    document.querySelectorAll('#catFilter .fc').forEach(x=>x.classList.remove('active'));
    fc.classList.add('active'); curCat=fc.dataset.cat; refresh();
  });
  observeReveal();
}

function renderCategories(){
  const cats=DATA.categories||[], arts=pubArticles();
  app.innerHTML=`
  <div class="container">
    <div class="page-title-row"><h2>🗂️ 分类目录</h2><span class="count-chip">${cats.length} 个</span></div>
    <p class="page-desc">按主题归类，点击查看分类下的文章</p>
    <div class="layout">
      <div>
        ${cats.map(c=>{
          const list=arts.filter(a=>a.categoryId===c.id);
          const g=gradOf(c.id);
          return `
          <div class="article-card" style="margin-bottom:16px" onclick="location.hash='#/category/${c.id}'">
            <div class="ac-cover" style="background:${g};width:150px;min-height:120px">${decoSpots(c.id)}<span class="ac-emoji" style="font-size:40px">${esc(list.length?byId.cat(c.id)?catEmoji(c.name):'📁':'📁')}</span></div>
            <div class="ac-body">
              <div class="ac-top"><span class="ac-cat" style="color:#fff;background:${g}">${esc(c.name)}</span><span class="ac-date">${list.length} 篇文章</span></div>
              <h4>${esc(c.name)}</h4>
              <p class="ac-summary">${list.length?('最新：'+esc(list[0].title)):'暂无文章'}</p>
            </div>
          </div>`;
        }).join('')||emptyBox('暂无分类')}
      </div>
      ${sidebarHTML([...arts].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5))}
    </div>
  </div>`;
  observeReveal();
}
function catEmoji(name){
  const map={'前端开发':'💻','生活随笔':'🌿','学习笔记':'📚','工具分享':'🧰'};
  return map[name]||'📁';
}

function renderFilterPage(type,id){
  const arts=pubArticles();
  let title,desc,list;
  if(type==='category'){
    const c=byId.cat(id); if(!c){app.innerHTML='<div class="container">'+emptyBox('分类不存在')+'</div>';return}
    title='🗂️ '+c.name; desc='分类「'+c.name+'」下的全部文章';
    list=arts.filter(a=>a.categoryId===id);
  }else{
    const t=byId.tag(id); if(!t){app.innerHTML='<div class="container">'+emptyBox('标签不存在')+'</div>';return}
    title='# '+t.name; desc='标签「#'+t.name+'」相关的文章';
    list=arts.filter(a=>(a.tagIds||[]).includes(id));
  }
  app.innerHTML=`
  <div class="container">
    <div class="page-title-row"><h2>${esc(title)}</h2><span class="count-chip">${list.length} 篇</span></div>
    <p class="page-desc">${esc(desc)} · <a href="#/articles" style="color:var(--primary)">← 返回全部文章</a></p>
    <div class="layout">
      <div>${list.map(articleCard).join('')||emptyBox('该分类下暂无文章')}</div>
      ${sidebarHTML([...arts].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5))}
    </div>
  </div>`;
  observeReveal();
}

function renderArticle(id){

  const idx=arts.findIndex(x=>x.id===id);
  const prev=arts[idx+1], next=arts[idx-1];
  const cat=byId.cat(a.categoryId);
  const tags=(a.tagIds||[]).map(t=>byId.tag(t)).filter(Boolean);
  document.title=(a.title||'文章')+' - '+(DATA.site?.title||'');
  app.innerHTML=`
  <article class="article-page">
    <button class="back-btn" onclick="history.length>1?history.back():location.hash='#/articles'">← 返回</button>

        </div>

        <div class="detail-tags">${tags.map(t=>`<span class="t" style="cursor:pointer" onclick="location.hash='#/tag/${t.id}'"># ${esc(t.name)}</span>`).join('')}</div>

function emptyBox(text){
  return `<div class="empty-state"><div class="e-icon">🍃</div><p>${esc(text||'暂无内容')}</p></div>`;
}

function renderSocials(site){
  const el1=document.getElementById('heroSocials'), el2=document.getElementById('aboutSocials');
  const html=(site.socials||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');
  if(el1)el1.innerHTML=html;
  if(el2)el2.innerHTML=html||'<span style="color:var(--text-3);font-size:13px">暂未配置</span>';
}

/* ================= 打字机 ================= */
function startTypewriter(text){
  const el=document.getElementById('typewriter'); if(!el)return;
  let i=0, deleting=false;
  (function tick(){
    if(!document.body.contains(el))return;
    if(!deleting){
      el.textContent=text.slice(0,++i);
      if(i>=text.length){deleting=true;setTimeout(tick,2600);return}
      setTimeout(tick,110);
    }else{
      el.textContent=text.slice(0,--i);
      if(i<=0){deleting=false;setTimeout(tick,500);return}
      setTimeout(tick,45);
    }
  })();
}

/* ================= 轮播 ================= */
let carTimer=null, carIdx=0;
function initCarousel(n){
  carIdx=0;
  const dots=document.getElementById('carouselDots');
  dots.innerHTML=Array.from({length:n},(_,i)=>`<span class="${i===0?'active':''}" onclick="carouselGo(${i})"></span>`).join('');
  const auto=()=>{carIdx=(carIdx+1)%n;carouselApply()};
  clearInterval(carTimer); carTimer=setInterval(auto,4500);
}
function carouselApply(){
  const track=document.getElementById('carouselTrack'); if(!track)return;
  track.style.transform='translateX(-'+(carIdx*100)+'%)';
  document.querySelectorAll('#carouselDots span').forEach((d,i)=>d.classList.toggle('active',i===carIdx));
}
function carouselMove(d){const n=document.querySelectorAll('.carousel-item').length;if(!n)return;carIdx=(carIdx+d+n)%n;carouselApply();clearInterval(carTimer);carTimer=setInterval(()=>{carIdx=(carIdx+1)%n;carouselApply()},4500)}
function carouselGo(i){carIdx=i;carouselApply()}

/* ================= 路由 ================= */
function route(){
  const hash=location.hash||'#/home';
  const [_,page,param]=hash.replace(/^#\/?/,'#/').split('/');
  const p=(page||'home').toLowerCase();
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===p));
  document.getElementById('mobileMenu').classList.remove('open');
  window.scrollTo({top:0});
  clearInterval(carTimer);
  if(p==='home')renderHome();
  else if(p==='articles')renderArticles();
  else if(p==='categories')renderCategories();
  else if(p==='category')renderFilterPage('category',param);
  else if(p==='tag')renderFilterPage('tag',param);
  else if(p==='article')renderArticle(param);
  else if(p==='messages')renderMessages();
  else if(p==='about')renderAbout();
  else renderHome();
}

/* ================= 入场动画 ================= */
let io=null;
function observeReveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08});
  document.querySelectorAll('.reveal,.article-card,.side-card,.msg-card').forEach(el=>io.observe(el));
}

/* ================= 启动 ================= */
async function boot(){
  try{
    const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DATA=await res.json();
  }catch(e){
    document.getElementById('loadingScreen').style.display='none';
    app.innerHTML='<div class="container" style="padding-top:80px">'+emptyBox('数据加载失败，请刷新重试')+'</div>';
    return;
  }
  const site=DATA.site||{};
  document.getElementById('logoText').textContent=site.title||'我的小站';
  document.getElementById('footBadge').textContent=site.avatar||'🐣';
  document.getElementById('footTitle').textContent=site.title||'我的小站';
  document.getElementById('footLinks').innerHTML=(site.socials||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');
  document.getElementById('footCopy').textContent='© '+(site.since||2026)+'-'+new Date().getFullYear()+' '+(site.title||'')+' · '+(site.footer||'');
  document.getElementById('loadingScreen').style.display='none';
  if(!location.hash)location.hash='#/home';
  route();
}

document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('open'));
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>{
  document.getElementById('siteHeader').classList.toggle('scrolled',window.scrollY>10);
  document.getElementById('toTop').classList.toggle('show',window.scrollY>420);
},{passive:true});
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
boot();
</script>

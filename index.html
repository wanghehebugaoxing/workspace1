<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="超能宝宝 - 相信记录的力量">
<meta name="theme-color" content="#0b1120">
<title>超能宝宝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120;
  --bg-2:#0f172a;
  --card:#151e32;
  --card-2:#1e293b;
  --border:#243447;
  --text:#e2e8f0;
  --text-2:#94a3b8;
  --text-3:#64748b;
  --primary:#60a5fa;
  --primary-2:#93c5fd;
  --grad:linear-gradient(135deg,#60a5fa 0%,#3b82f6 55%,#2563eb 100%);
  --grad-soft:linear-gradient(135deg,rgba(96,165,250,.12),rgba(59,130,246,.06));
  --danger:#f87171;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 2px 12px rgba(0,0,0,.18);
  --shadow-md:0 8px 26px rgba(0,0,0,.28);
  --shadow-lg:0 18px 46px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --art:"Zhi Mang Xing","Ma Shan Zheng","ZCOOL XiaoWei","Kaiti SC","STKaiti","KaiTi","楷体",cursive,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
button{font-family:inherit}
::selection{background:rgba(96,165,250,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#475569}
::-webkit-scrollbar-track{background:transparent}

#sakura{position:fixed;inset:0;z-index:60;pointer-events:none}
.click-heart{position:fixed;z-index:9999;pointer-events:none;animation:heartUp 1.6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes heartUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-300%) scale(.85) rotate(20deg)}
}

.loading-screen{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.loading-screen .spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(96,165,250,.2);border-top-color:#60a5fa;animation:spin 1s linear infinite}
.loading-screen p{color:var(--text-3);font-size:14px;letter-spacing:2px}
@keyframes spin{to{transform:rotate(360deg)}}

.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(11,17,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:box-shadow .25s,background .35s}
.header.scrolled{box-shadow:0 4px 20px rgba(0,0,0,.25)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;flex-shrink:0}
.logo .logo-badge{width:38px;height:38px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 16px rgba(59,130,246,.45)}
.logo .logo-badge img{width:100%;height:100%;object-fit:cover;display:block}
.logo .logo-text{font-family:var(--art);font-weight:400;letter-spacing:2px;color:var(--primary);font-size:21px;text-shadow:0 0 16px rgba(96,165,250,.25)}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a{padding:7px 16px;border-radius:20px;font-size:14.5px;color:var(--text-2);transition:all .18s}
.nav a:hover{color:var(--primary);background:rgba(96,165,250,.10)}
.nav a.active{color:#fff;background:var(--grad);box-shadow:0 4px 14px rgba(59,130,246,.45);font-weight:500}
.nav .nav-admin{margin-left:8px;display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:13px}
.nav .nav-admin:hover{color:var(--primary)}
.menu-btn{display:none;margin-left:auto;width:40px;height:40px;border:none;background:transparent;border-radius:10px;cursor:pointer;color:var(--text);font-size:20px}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;z-index:99;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px 16px;box-shadow:var(--shadow-md)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 16px;border-radius:10px;color:var(--text-2);font-size:15px}
.mobile-menu a.active{color:var(--primary);background:rgba(96,165,250,.12);font-weight:600}

.container{max-width:1200px;margin:0 auto;padding:0 24px}
.main{min-height:calc(100vh - 200px)}
.page{padding-top:96px;padding-bottom:50px}
.page-title-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.page-title-row h2{font-size:24px;font-weight:700}
.page-title-row .count-chip{font-size:12.5px;color:var(--primary);background:rgba(96,165,250,.12);padding:3px 10px;border-radius:12px;font-weight:600}
.page-desc{color:var(--text-2);font-size:14px;margin-bottom:20px}

.hero{position:relative;min-height:100vh;min-height:100svh;margin-top:-64px;padding-top:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(37,99,235,.18),transparent),linear-gradient(180deg,#0b1222 0%,#0f172a 70%,var(--bg) 100%)}
.hero-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(96,165,250,.12) 1.5px,transparent 1.5px);background-size:30px 30px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 30%,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:blobFloat 10s ease-in-out infinite}
.blob-1{width:360px;height:360px;background:#1d4ed8;top:-100px;left:-80px}
.blob-2{width:300px;height:300px;background:#2563eb;bottom:-80px;right:-60px;animation-delay:-3s}
.blob-3{width:220px;height:220px;background:#3b82f6;top:35%;right:15%;animation-delay:-6s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.06)}}
.hero-inner{position:relative;text-align:center;padding:30px 24px 60px;max-width:760px}
.hero-avatar{width:118px;height:118px;margin:0 auto 24px;border-radius:24px;background:var(--grad);padding:4px;box-shadow:0 12px 34px rgba(37,99,235,.45);animation:avaFloat 4s ease-in-out infinite}
.hero-avatar .inner{width:100%;height:100%;border-radius:20px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-avatar .inner img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes avaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-title{font-family:var(--art);font-size:clamp(40px,7vw,64px);font-weight:400;letter-spacing:4px;margin-bottom:16px;color:var(--text);text-shadow:0 2px 8px rgba(96,165,250,.25),0 0 30px rgba(59,130,246,.15)}
.hero-poem{font-family:var(--art);font-size:clamp(20px,3.4vw,28px);color:var(--primary-2);margin-bottom:8px;min-height:40px;letter-spacing:1.5px}
.hero-poem #poemText{transition:opacity .45s}
.hero-poem #poemFrom{display:block;font-size:13px;color:var(--text-3);margin-top:6px;font-style:normal;letter-spacing:2px;transition:opacity .45s}
.fade-out{opacity:0!important}
.hero-sub{font-size:clamp(14px,2.2vw,17px);color:var(--text-2);min-height:30px;margin:20px 0 28px}
.hero-sub .cursor{display:inline-block;width:2px;height:1.1em;background:var(--primary);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-socials{display:flex;justify-content:center;gap:12px;margin-bottom:30px;flex-wrap:wrap}
.hero-socials a{padding:8px 20px;border-radius:22px;background:var(--card);border:1px solid var(--border);font-size:13.5px;color:var(--text-2);box-shadow:var(--shadow);transition:all .2s}
.hero-socials a:hover{color:var(--primary);border-color:rgba(96,165,250,.45);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.hero-stats{display:flex;justify-content:center;gap:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px;max-width:430px;margin:0 auto;box-shadow:var(--shadow)}
.hero-stats .stat{flex:1;text-align:center;cursor:pointer;transition:transform .2s}
.hero-stats .stat:hover{transform:translateY(-2px)}
.hero-stats .stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stats .stat span{font-size:12.5px;color:var(--text-2)}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:26px;color:var(--primary);animation:bounce 2s infinite;cursor:pointer}
@keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}

.section{padding:44px 0 10px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.section-head .bar{width:5px;height:22px;border-radius:3px;background:var(--grad)}
.section-head h3{font-size:20px;font-weight:700}
.section-head .more{margin-left:auto;font-size:13.5px;color:var(--primary)}

.article-card{display:flex;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .25s;margin-bottom:18px}
.article-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:rgba(96,165,250,.35)}
.article-card:hover .ac-title{color:var(--primary)}
.ac-cover{position:relative;width:170px;min-height:130px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ac-emoji{font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));z-index:1}
.cc-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.ac-body{padding:18px 22px;flex:1;min-width:0;display:flex;flex-direction:column}
.ac-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ac-cat{font-size:12px;color:var(--primary);background:rgba(96,165,250,.12);padding:2px 10px;border-radius:10px;font-weight:600}
.ac-date{font-size:12px;color:var(--text-3)}
.ac-title{font-size:17px;font-weight:700;margin-bottom:6px;transition:color .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-summary{font-size:13.5px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.ac-meta{display:flex;align-items:center;gap:14px;margin-top:auto;flex-wrap:wrap}
.ac-meta .m-item{font-size:12px;color:var(--text-3)}
.ac-tags{display:flex;gap:6px;flex-wrap:wrap}
.ac-tags .t{font-size:11.5px;color:var(--primary);background:var(--grad-soft);padding:2px 9px;border-radius:10px;cursor:pointer;transition:all .18s}
.ac-tags .t:hover{background:var(--grad);color:#fff}

.art-layout{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.art-side{position:sticky;top:84px}
.side-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px;margin-bottom:18px}
.side-card h5{font-size:14px;font-weight:700;margin-bottom:14px;padding-left:10px;border-left:3px solid;border-image:var(--grad) 1}
.mini-blogger{text-align:center}
.mini-blogger .mb-ava{width:68px;height:68px;border-radius:18px;background:var(--grad);padding:3px;margin:0 auto 10px}
.mini-blogger .mb-ava .inner{width:100%;height:100%;border-radius:15px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini-blogger .mb-ava .inner img{width:100%;height:100%;object-fit:cover;display:block}
.mini-blogger .mb-name{font-size:15px;font-weight:700}
.mini-blogger .mb-sign{font-size:12.5px;color:var(--text-3);margin-top:3px}
.cat-list{list-style:none}
.cat-list li{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;font-size:13.5px;color:var(--text-2);cursor:pointer;transition:all .18s;margin-bottom:2px}
.cat-list li:hover{color:var(--primary);background:rgba(96,165,250,.08)}
.cat-list li.active{color:#fff;background:var(--grad);font-weight:600}
.cat-list li .cnt{font-size:11.5px;background:rgba(96,165,250,.14);color:var(--primary);padding:1px 8px;border-radius:9px}
.cat-list li.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud .tc{font-size:12px;color:var(--primary);background:var(--grad-soft);padding:3px 11px;border-radius:12px;cursor:pointer;transition:all .18s}
.tag-cloud .tc:hover{background:var(--grad);color:#fff;transform:translateY(-2px)}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:10px 18px;box-shadow:var(--shadow);margin-bottom:18px;transition:border-color .2s}
.search-box:focus-within{border-color:rgba(96,165,250,.5)}
.search-box .s-icon{font-size:15px}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:inherit}
.search-box input::placeholder{color:var(--text-3)}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.cat-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .25s}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:rgba(96,165,250,.35)}
.cat-card .cc-cover{height:110px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cat-card .cc-cover .cc-emoji{font-size:44px;z-index:1}
.cat-card .cc-body{padding:16px 20px}
.cat-card .cc-body h4{font-size:16px;font-weight:700;margin-bottom:4px}
.cat-card .cc-body p{font-size:12.5px;color:var(--text-3)}

.article-page{max-width:860px;margin:0 auto;padding:96px 24px 60px}
.back-btn{border:none;background:var(--card);color:var(--text-2);padding:9px 20px;border-radius:20px;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);margin-bottom:18px;transition:all .2s}
.back-btn:hover{color:var(--primary);transform:translateX(-3px)}
.detail-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);border:1px solid var(--border);overflow:hidden}
.detail-banner{height:180px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.d-emoji{font-size:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));z-index:1}
.detail-body{padding:34px 40px 40px}
.detail-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-3);margin-bottom:14px;flex-wrap:wrap}
.detail-meta .d-cat{color:var(--primary);background:rgba(96,165,250,.12);padding:3px 12px;border-radius:11px;font-weight:600}
.detail-body h1{font-size:26px;font-weight:800;line-height:1.4;margin-bottom:14px}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.detail-tags .t{font-size:12px;color:var(--primary);background:var(--grad-soft);padding:3px 11px;border-radius:12px;cursor:pointer;transition:all .18s}
.detail-tags .t:hover{background:var(--grad);color:#fff}
.detail-nav{display:flex;justify-content:space-between;gap:16px;margin-top:36px;padding-top:22px;border-top:1px dashed var(--border)}
.detail-nav a{max-width:46%}
.dn-label{font-size:12px;color:var(--text-3);margin-bottom:3px}
.dn-title{font-size:14px;font-weight:600;color:var(--primary)}

.md{font-size:15px;color:var(--text);line-height:1.85}
.md h1,.md h2,.md h3,.md h4{margin:1.5em 0 .7em;font-weight:700;line-height:1.4}
.md h1{font-size:23px}.md h2{font-size:20px}.md h3{font-size:17px}.md h4{font-size:15.5px}
.md h2{padding-left:12px;border-left:4px solid;border-image:var(--grad) 1}
.md p{margin:.75em 0}
.md a{color:var(--primary);border-bottom:1px dashed rgba(96,165,250,.5)}
.md strong{color:var(--primary);font-weight:700}
.md code{font-family:var(--mono);font-size:.88em;background:var(--grad-soft);color:var(--primary);padding:2px 7px;border-radius:6px}
.md pre{background:#0b1222;border-radius:12px;padding:18px 20px;overflow-x:auto;margin:1.1em 0}
.md pre code{background:transparent;color:#e2e8f0;padding:0;font-size:13px;line-height:1.7;display:block}
.md blockquote{border-left:4px solid;border-image:var(--grad) 1;padding:10px 18px;margin:1em 0;background:var(--grad-soft);border-radius:0 12px 12px 0;color:var(--text-2)}
.md ul,.md ol{margin:.7em 0;padding-left:1.7em}
.md li{margin:.35em 0}
.md table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:14px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.md th{background:var(--grad);color:#fff}
.md th,.md td{padding:10px 14px;text-align:left;border:none}
.md tr:nth-child(even) td{background:rgba(96,165,250,.05)}
.md hr{border:none;height:1px;background:var(--border);margin:1.8em 0}
.md img{border-radius:12px;box-shadow:var(--shadow)}

.about-wrap{max-width:840px;margin:0 auto;padding:96px 24px 60px}
.about-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:38px 42px;border:1px solid var(--border)}
.about-hero{display:flex;align-items:center;gap:24px;margin-bottom:28px}
.about-hero .a-ava{width:96px;height:96px;border-radius:22px;background:var(--grad);padding:3px;flex-shrink:0}
.about-hero .a-ava .inner{width:100%;height:100%;border-radius:19px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center}
.about-hero .a-ava .inner img{width:100%;height:100%;object-fit:cover;display:block}
.about-hero h2{font-size:24px;font-weight:800;margin-bottom:6px}
.about-hero p{color:var(--text-2);font-size:14px}
.about-section{margin-top:26px}
.about-section h4{font-size:16px;font-weight:700;margin-bottom:14px;padding-left:12px;border-left:4px solid;border-image:var(--grad) 1}
.skill-chips{display:flex;flex-wrap:wrap;gap:9px}
.skill-chips span{font-size:13px;padding:5px 15px;border-radius:17px;background:var(--grad-soft);color:var(--primary);border:1px solid rgba(96,165,250,.2)}
.about-list{list-style:none}
.about-list li{padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px;color:var(--text-2);display:flex;gap:8px}
.about-list li b{color:var(--text);flex-shrink:0}

.empty-state{text-align:center;color:var(--text-3);padding:70px 20px;font-size:14px}
.empty-state .e-icon{font-size:44px;margin-bottom:14px;opacity:.85}
.empty-state .e-tip{margin-top:10px;font-size:13px}
.empty-state .e-tip a{color:var(--primary)}

.footer{margin-top:30px;border-top:1px solid var(--border);background:var(--bg-2)}
.footer-inner{max-width:1200px;margin:0 auto;padding:30px 24px;text-align:center}
.f-brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:10px}
.f-brand .logo-badge{width:30px;height:30px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;overflow:hidden}
.f-brand .logo-badge img{width:100%;height:100%;object-fit:cover;display:block}
.f-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.f-links a{font-size:13px;color:var(--text-3);transition:color .2s}
.f-links a:hover{color:var(--primary)}
.f-copy{font-size:12.5px;color:var(--text-3)}
.f-admin{margin-top:8px}
.f-admin a{font-size:12px;color:var(--text-3)}
.f-admin a:hover{color:var(--primary)}

.float-btns{position:fixed;right:22px;bottom:26px;z-index:110;display:flex;flex-direction:column;gap:10px}
.float-btns button{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);color:var(--primary);font-size:19px;cursor:pointer;box-shadow:var(--shadow-md);transition:all .22s;display:flex;align-items:center;justify-content:center}
.float-btns button:hover{transform:translateY(-4px) scale(1.05);box-shadow:var(--shadow-lg)}
.float-btns .to-top{opacity:0;pointer-events:none;transition:all .25s}
.float-btns .to-top.show{opacity:1;pointer-events:auto}

<script>
const GRADS = [
  ['#60a5fa','#3b82f6'],['#93c5fd','#60a5fa'],['#a78bfa','#8b5cf6'],['#38bdf8','#3b82f6'],
  ['#22d3ee','#0ea5e9'],['#7dd3fc','#60a5fa'],['#c084fc','#a855f7'],['#67e8f9','#22d3ee']
];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}
function gradOf(key){const g=GRADS[hashStr(String(key))%GRADS.length];return 'linear-gradient(135deg,'+g[0]+' 0%,'+g[1]+' 100%)'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日'}
function debounce(fn,ms){let t=null;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms)}}

function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s;
}
function mdToHtml(src){
  if(!src) return '';
  const codeBlocks = [];
  src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codeBlocks.push({lang,code});
    return '\u0001CB'+(codeBlocks.length-1)+'\u0001';
  });
  const lines = src.split('\n');
  let html='', inUl=false, inOl=false, inQuote=false, inTable=false, tableRows=[];
  const closeList=()=>{ if(inUl){html+='</ul>';inUl=false} if(inOl){html+='</ol>';inOl=false} };
  const closeQuote=()=>{ if(inQuote){html+='</blockquote>';inQuote=false} };
  const closeTable=()=>{
    if(!inTable)return;
    let t='<table><thead><tr>';
    tableRows[0].forEach(c=>t+='<th>'+inlineMd(c)+'</th>');
    t+='</tr></thead><tbody>';
    for(let i=1;i<tableRows.length;i++){t+='<tr>';tableRows[i].forEach(c=>t+='<td>'+inlineMd(c)+'</td>');t+='</tr>'}
    t+='</tbody></table>'; html+=t; inTable=false; tableRows=[];
  };
  const flushPara=(buf)=>{ if(buf.length) html+='<p>'+inlineMd(buf.join(' '))+'</p>'; };
  let para=[];
  const flushP=()=>{flushPara(para);para=[]};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const cbMatch=line.match(/^\u0001CB(\d+)\u0001\s*$/);
    if(cbMatch){flushP();closeList();closeQuote();closeTable();const b=codeBlocks[+cbMatch[1]];html+='<pre><code>'+esc(b.code.replace(/\n$/,''))+'</code></pre>';continue}
    if(/^\s*$/.test(line)){flushP();closeList();closeQuote();closeTable();continue}
    if(/^\|(.+)\|\s*$/.test(line)){
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))){continue}
      if(!inTable){flushP();closeList();closeQuote();inTable=true;tableRows=[]}
      tableRows.push(cells);continue;
    }else{closeTable()}
    const h=line.match(/^(#{1,4})\s+(.*)/);
    if(h){flushP();closeList();closeQuote();const lv=h[1].length;html+='<h'+lv+'>'+inlineMd(h[2])+'</h'+lv+'>';continue}
    if(/^>\s?/.test(line)){flushP();closeList();if(!inQuote){html+='<blockquote>';inQuote=true}html+='<p>'+inlineMd(line.replace(/^>\s?/,''))+'</p>';continue}
    closeQuote();
    if(/^[-*]\s+/.test(line)){flushP();if(inOl){html+='</ol>';inOl=false}if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}
    if(/^\d+\.\s+/.test(line)){flushP();if(inUl){html+='</ul>';inUl=false}if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inlineMd(line.replace(/^\d+\.\s+/,''))+'</li>';continue}
    if(/^(---|\*\*\*)\s*$/.test(line)){flushP();closeList();html+='<hr>';continue}
    closeList();
    para.push(line.trim());
  }
  flushP();closeList();closeQuote();closeTable();
  return html;
}

const POEMS = [

let poemTimer=null;
function startPoem(){
  clearInterval(poemTimer);
  let idx=Math.floor(Math.random()*POEMS.length);
  const paint=()=>{
    const el=document.getElementById('poemText');
    const from=document.getElementById('poemFrom');
    if(!el)return;
    el.classList.add('fade-out');from.classList.add('fade-out');
    setTimeout(()=>{
      const p=POEMS[idx%POEMS.length];
      el.textContent=p[0];
      from.textContent='—— '+p[1];
      el.classList.remove('fade-out');from.classList.remove('fade-out');
    },450);
    idx++;
  };
  paint();
  poemTimer=setInterval(paint,9000);
}

(function sakura(){
  const cv=document.getElementById('sakura');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let W=0,H=0,petals=[];
  const COLORS=['#60a5fa','#93c5fd','#3b82f6','#7dd3fc','#a78bfa'];
  function mkP(fromTop){
    return {
      x:Math.random()*W,
      y:fromTop?-20:Math.random()*H,
      s:3+Math.random()*5,
      vy:.35+Math.random()*.9,
      vx:(Math.random()-.5)*.5,
      r:Math.random()*Math.PI*2,
      vr:(Math.random()-.5)*.02,
      sway:Math.random()*Math.PI*2,
      swayV:.006+Math.random()*.015,
      c:COLORS[Math.random()*COLORS.length|0],
      o:.35+Math.random()*.35
    };
  }
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  window.addEventListener('resize',resize);
  resize();
  for(let i=0;i<24;i++)petals.push(mkP(false));
  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.r);
    ctx.scale(1,.55+Math.abs(Math.sin(p.sway))*.45);
    ctx.beginPath();
    ctx.moveTo(0,-p.s);
    ctx.bezierCurveTo(p.s*.95,-p.s*.4,p.s*.7,p.s*.85,0,p.s);
    ctx.bezierCurveTo(-p.s*.7,p.s*.85,-p.s*.95,-p.s*.4,0,-p.s);
    ctx.fillStyle=p.c;
    ctx.globalAlpha=p.o;
    ctx.fill();
    ctx.restore();
  }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    petals.forEach(p=>{
      p.sway+=p.swayV;
      p.x+=p.vx+Math.sin(p.sway)*.5;
      p.y+=p.vy;
      p.r+=p.vr;
      if(p.y>H+30||p.x<-30||p.x>W+30)Object.assign(p,mkP(true));
      drawPetal(p);
    });
    requestAnimationFrame(loop);
  })();
})();

(function theme(){

    if(btn)btn.textContent=t==='dark'?'☀️':'🌙';
  }
  let saved=null;
  try{saved=localStorage.getItem('poet_theme')}catch(err){}
  apply(saved||'dark');
  if(btn)btn.addEventListener('click',()=>{
    apply(document.documentElement.dataset.theme==='dark'?'light':'dark');
  });
})();

  return '<span class="cc-deco" style="width:'+(90+h%60)+'px;height:'+(90+h%60)+'px;top:'+(h%30)+'%;left:'+(h%40)+'%"></span>'+
         '<span class="cc-deco" style="width:'+(40+h%30)+'px;height:'+(40+h%30)+'px;bottom:'+(h%25)+'%;right:'+(h%35)+'%"></span>';
}

  <div class="container page">
    <div class="page-title-row"><h2>📄 全部文章</h2><span class="count-chip">${arts.length} 篇</span></div>
    <p class="page-desc">共 ${arts.length} 篇文章，累计阅读 ${arts.reduce((s,a)=>s+(a.views||0),0)} 次</p>
    <div class="art-layout">

        <div class="search-box"><span class="s-icon">🔍</span><input id="artSearch" type="search" placeholder="搜索文章标题或摘要…"></div>
        <div id="artList">${arts.map(articleCard).join('')||emptyBox('空空如也，去后台写下第一篇吧')}</div>
      </div>
    </div>
  </div>`;
  const search=document.getElementById('artSearch');
  let curCat='';
  const refresh=()=>{
    const q=(search.value||'').trim().toLowerCase();
    const list=arts.filter(a=>(!curCat||a.categoryId===curCat)&&(!q||(a.title||'').toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)));
    document.getElementById('artList').innerHTML=list.map(articleCard).join('')||emptyBox('没有找到相关文章');
    observeReveal();
  };

    const li=e.target.closest('li'); if(!li)return;
    document.querySelectorAll('#catList li').forEach(x=>x.classList.remove('active'));
    li.classList.add('active'); curCat=li.dataset.cat; refresh();
  });

}

        </div>`;
      }).join('')}
    </div>`:emptyBox('还没有分类，去后台添加吧')}
  </div>`;
  observeReveal();
}
function catEmoji(name){
  const map={'前端开发':'💻','生活随笔':'🌿','学习笔记':'📚','工具分享':'🧰','日常杂记':'🌷','技术笔记':'⌨️'};
  return map[name]||'🌸';
}

function renderFilterPage(type,id){
  const arts=pubArticles();
  let title,desc,list,curCat='';
  if(type==='category'){
    const c=byId.cat(id); if(!c){app.innerHTML='<div class="container page">'+emptyBox('分类不存在')+'</div>';return}
    title='🗂️ '+c.name; desc='分类「'+c.name+'」下的全部文章';
    list=arts.filter(a=>a.categoryId===id); curCat=id;
  }else{
    const t=byId.tag(id); if(!t){app.innerHTML='<div class="container page">'+emptyBox('标签不存在')+'</div>';return}
    title='# '+t.name; desc='标签「#'+t.name+'」相关的文章';
    list=arts.filter(a=>(a.tagIds||[]).includes(id));
  }
  app.innerHTML=`
  <div class="container page">
    <div class="page-title-row"><h2>${esc(title)}</h2><span class="count-chip">${list.length} 篇</span></div>
    <p class="page-desc">${esc(desc)}</p>
    <div class="art-layout">
      ${artSidebar(curCat)}
      <div id="artList">${list.map(articleCard).join('')||emptyBox('该分类下暂无文章')}</div>
    </div>
  </div>`;
  document.getElementById('catList').addEventListener('click',e=>{
    const li=e.target.closest('li'); if(!li)return;
    const c=li.dataset.cat;
    if(c)location.hash='#/category/'+c;
    else location.hash='#/articles';
  });
  observeReveal();
}

function renderArticle(id){
  const a=byId.article(id);
  if(!a||a.published===false){app.innerHTML='<div class="container page">'+emptyBox('文章不存在或未发布')+'</div>';return}
  const arts=pubArticles();
  const idx=arts.findIndex(x=>x.id===id);
  const prev=arts[idx+1], next=arts[idx-1];
  const cat=byId.cat(a.categoryId);
  const tags=(a.tagIds||[]).map(t=>byId.tag(t)).filter(Boolean);
  document.title=(a.title||'文章')+' - '+(DATA.site?.title||'');
  app.innerHTML=`
  <article class="article-page">
    <button class="back-btn" onclick="history.length>1?history.back():location.hash='#/articles'">← 返回</button>
    <div class="detail-card">
      <div class="detail-banner" style="background:${gradOf(a.id)}">${decoSpots(a.id)}<span class="d-emoji">${esc(a.cover||'📄')}</span></div>
      <div class="detail-body">
        <div class="detail-meta">
          <span class="d-cat">${esc(cat?cat.name:'随笔')}</span>
          <span>📅 ${fmtDate(a.createdAt)}</span>
          <span>👁 ${a.views||0} 次阅读</span>
        </div>
        <h1>${esc(a.title)}</h1>
        <div class="detail-tags">${tags.map(t=>`<span class="t" style="cursor:pointer" onclick="location.hash='#/tag/${t.id}'"># ${esc(t.name)}</span>`).join('')}</div>
        <div class="md">${mdToHtml(a.content)}</div>
        <div class="detail-nav">
          ${prev?`<a href="#/article/${prev.id}"><div class="dn-label">← 上一篇</div><div class="dn-title">${esc(prev.title)}</div></a>`:'<span></span>'}
          ${next?`<a href="#/article/${next.id}" style="text-align:right"><div class="dn-label">下一篇 →</div><div class="dn-title">${esc(next.title)}</div></a>`:''}
        </div>
      </div>
    </div>
  </article>`;
  observeReveal();
}

  document.title='关于 - '+(site.title||'');
  app.innerHTML=`
  <div class="about-wrap">
    <div class="about-card">

        <div class="a-ava"><div class="inner"><img src="avatar.png" alt="超能宝宝"></div></div>

          <h2>${esc(site.title||'')}</h2>
          <p>${esc(site.signature||'')}</p>

      <div class="about-section">
        <h4>🏡 关于本站</h4>
        <ul class="about-list">
          <li><b>站点名称</b>${esc(site.title||'')}</li>
          <li><b>站点描述</b>${esc(site.subtitle||'')}</li>

function emptyBox(text){
  return `<div class="empty-state"><div class="e-icon">🍃</div><p>${esc(text||'暂无内容')}</p></div>`;
}
function renderSocials(site){
  const el1=document.getElementById('heroSocials'), el2=document.getElementById('aboutSocials');
  const html=(site.socials||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');
  if(el1)el1.innerHTML=html;
  if(el2)el2.innerHTML=html||'<span style="color:var(--text-3);font-size:13px">暂未配置</span>';
}

function startTypewriter(text){
  const el=document.getElementById('typewriter'); if(!el)return;
  let i=0, deleting=false;
  (function tick(){
    if(!document.body.contains(el))return;
    if(!deleting){
      el.textContent=text.slice(0,++i);
      if(i>=text.length){deleting=true;setTimeout(tick,2600);return}
      setTimeout(tick,110);
    }else{
      el.textContent=text.slice(0,--i);
      if(i<=0){deleting=false;setTimeout(tick,500);return}
      setTimeout(tick,45);
    }
  })();
}

function route(){
  const hash=location.hash||'#/home';
  const [_,page,param]=hash.replace(/^#\/?/,'#/').split('/');
  const p=(page||'home').toLowerCase();
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===p));
  document.getElementById('mobileMenu').classList.remove('open');
  window.scrollTo({top:0});
  clearInterval(poemTimer);
  if(p==='home')renderHome();
  else if(p==='articles')renderArticles();
  else if(p==='categories')renderCategories();
  else if(p==='category')renderFilterPage('category',param);
  else if(p==='tag')renderFilterPage('tag',param);
  else if(p==='article')renderArticle(param);
  else if(p==='about')renderAbout();
  else if(p==='messages'){location.replace('#/home');return}
  else renderHome();
}

let io=null;
function observeReveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08});
  document.querySelectorAll('.reveal,.article-card,.side-card,.cat-card').forEach(el=>io.observe(el));
}

async function boot(){
  try{
    const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DATA=await res.json();
  }catch(e){
    document.getElementById('loadingScreen').style.display='none';
    app.innerHTML='<div class="container page">'+emptyBox('数据加载失败，请刷新重试')+'</div>';
    return;
  }
  const site=DATA.site||{};
  document.getElementById('logoText').textContent=site.title||'超能宝宝';
  document.getElementById('footTitle').textContent=site.title||'超能宝宝';
  document.getElementById('footLinks').innerHTML=(site.socials||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');
  document.getElementById('footCopy').textContent='© '+(site.since||2026)+'-'+new Date().getFullYear()+' '+(site.title||'')+' · '+(site.footer||'相信记录的力量');
  document.getElementById('loadingScreen').style.display='none';
  if(!location.hash)location.hash='#/home';
  route();
}

document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('open'));
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>{
  document.getElementById('siteHeader').classList.toggle('scrolled',window.scrollY>10);
  document.getElementById('toTop').classList.toggle('show',window.scrollY>420);
});
document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
boot();
</script>

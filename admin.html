<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>管理后台 - 我的小站</title>
<style>
:root{
  --bg:#f4f5f9;--card:#fff;--border:#e5e8f0;--text:#2b2f3a;--text-2:#7a8194;--text-3:#a3a9bb;
  --primary:#5b6ef5;--primary-2:#8b5cf6;--grad:linear-gradient(135deg,#5b6ef5,#8b5cf6);
  --danger:#ef4444;--success:#10b981;--warning:#f59e0b;
  --side-bg:#20233a;--side-text:#9aa0c0;--side-active:#2a2e4d;
  --radius:12px;--radius-sm:8px;
  --shadow:0 2px 10px rgba(43,47,58,.05);--shadow-md:0 8px 24px rgba(43,47,58,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9cede;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 登录页 ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(160deg,#eef0fb 0%,#f6f2fb 60%,#fdf0f5 100%)}
.login-wrap .lb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.login-wrap .lb1{width:380px;height:380px;background:#c7d0ff;top:-100px;left:-80px}
.login-wrap .lb2{width:300px;height:300px;background:#e8cfff;bottom:-80px;right:-60px}
.login-card{position:relative;width:100%;max-width:420px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:38px 36px;box-shadow:0 24px 60px rgba(43,47,58,.15)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.login-logo .badge{width:76px;height:76px;border-radius:22px;background:var(--grad);padding:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 12px 30px rgba(91,110,245,.4)}
.login-logo .badge .inner{width:100%;height:100%;border-radius:19px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center}
.login-logo .badge .inner img{width:100%;height:100%;object-fit:cover;display:block}
.login-logo h1{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-sub{color:var(--text-2);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,110,245,.12)}
.field .hint{font-size:12px;color:var(--text-3);margin-top:5px}
.field .hint a{color:var(--primary)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;font-size:16px;padding:6px;color:var(--text-3)}
.login-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px;font-size:13px;color:var(--text-2)}
.login-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:13.5px;font-weight:500;transition:all .2s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 16px rgba(91,110,245,.35)}
.btn-primary:hover{color:#fff;transform:translateY(-1px);box-shadow:0 9px 22px rgba(91,110,245,.45)}
.btn-danger{color:var(--danger);border-color:rgba(239,68,68,.35)}
.btn-danger:hover{background:rgba(239,68,68,.06);border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%;padding:12px;font-size:15px;font-weight:600}
.login-help{margin-top:22px;border-top:1px dashed var(--border);padding-top:16px;font-size:12.5px;color:var(--text-3);line-height:1.8}
.login-help summary{cursor:pointer;font-weight:600;color:var(--text-2)}
.login-help ol{margin:8px 0 0 18px}
.login-help code{background:rgba(91,110,245,.08);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:11.5px}

/* ===== 主布局 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s}
.side-logo{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.side-logo .badge{width:42px;height:42px;border-radius:14px;background:var(--grad);padding:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.side-logo .badge .inner{width:100%;height:100%;border-radius:12px;background:var(--side-bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.side-logo .badge .inner img{width:100%;height:100%;object-fit:cover;display:block}
.side-logo b{color:#fff;font-size:15px}
.side-logo small{display:block;font-size:10.5px;color:var(--side-text);font-weight:400}
.side-menu{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.side-menu a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:var(--side-text);font-size:14px;transition:all .18s}
.side-menu a:hover{color:#fff;background:rgba(255,255,255,.05)}
.side-menu a.active{color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(91,110,245,.35)}
.side-menu a .mi{width:19px;text-align:center;font-size:15px}
.side-menu .side-sep{font-size:11px;color:#565a78;padding:14px 14px 6px;letter-spacing:1px}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06)}
.side-foot .repo-chip{font-size:11px;color:var(--side-text);background:rgba(255,255,255,.05);padding:5px 10px;border-radius:7px;font-family:var(--mono);word-break:break-all;margin-bottom:10px}
.main-area{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 26px;height:60px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:17px;font-weight:700}
.topbar .tb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar .tb-user{font-size:12.5px;color:var(--text-2);background:var(--bg);padding:6px 12px;border-radius:16px}
.content{padding:26px;flex:1}
.overlay-menu{display:none}

/* ===== 仪表盘 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;border:1px solid rgba(229,232,240,.6);transition:all .25s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat-card .sc-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0}
.stat-card b{display:block;font-size:24px;font-weight:800}
.stat-card span{font-size:12.5px;color:var(--text-2)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(229,232,240,.6);margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.panel-head .ph-more{margin-left:auto;font-size:12.5px;font-weight:400}
.panel-body{padding:18px 20px}
.mini-list{list-style:none}
.mini-list li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--border);font-size:13.5px}
.mini-list li:last-child{border:none}
.mini-list .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);flex-shrink:0}
.mini-list .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-list .d{color:var(--text-3);font-size:12px;flex-shrink:0}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border-radius:var(--radius);background:var(--bg);border:1px dashed var(--border);transition:all .2s;font-size:13px;color:var(--text-2)}
.quick-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(91,110,245,.05);transform:translateY(-2px)}
.quick-btn .qi{font-size:26px}

/* ===== 表格 ===== */
.table-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.table-toolbar .search{position:relative;flex:1;min-width:200px;max-width:320px}
.table-toolbar .search input{width:100%;padding:9px 13px 9px 36px;border:1.5px solid var(--border);border-radius:9px;background:#fff}
.table-toolbar .search input:focus{border-color:var(--primary)}
.table-toolbar .search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.table-toolbar select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:#fff;cursor:pointer}
.table-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{text-align:left;padding:12px 14px;background:#f8f9fd;color:var(--text-2);font-weight:600;font-size:12.5px;white-space:nowrap}
table.dt td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tr:hover td{background:#fafbfe}
.t-cover{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff}
.t-title{font-weight:600;cursor:pointer}
.t-title:hover{color:var(--primary)}
.badge{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:10px;font-weight:600}
.badge.pub{color:var(--success);background:rgba(16,185,129,.1)}
.badge.draft{color:var(--warning);background:rgba(245,158,11,.12)}
.badge.cat{color:var(--primary);background:rgba(91,110,245,.1)}
.row-actions{display:flex;gap:6px;white-space:nowrap}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .18s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn.del:hover{border-color:var(--danger);color:var(--danger)}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.pager button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--text-2)}
.pager button.cur{background:var(--grad);border:none;color:#fff;font-weight:600}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .p-info{font-size:12.5px;color:var(--text-3);margin:0 8px}

/* ===== 编辑器 ===== */
.editor-wrap{max-width:960px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.form-grid .span2{grid-column:span 2}
.field textarea{resize:vertical;min-height:90px;line-height:1.7}
.md-editor{position:relative}
.md-editor textarea{width:100%;min-height:420px;padding:16px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-family:var(--mono);font-size:13.5px;line-height:1.8;resize:vertical;tab-size:2}
.md-editor textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,110,245,.1)}
.md-preview{border:1.5px solid var(--border);border-radius:10px;padding:16px 20px;min-height:420px;background:#fff}
.md-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.md-toolbar .mt-btn{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;color:var(--text-2)}
.md-toolbar .mt-btn:hover{border-color:var(--primary);color:var(--primary)}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#d4d8e4;border-radius:24px;transition:.25s;cursor:pointer}
.switch .sl::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked+.sl{background:var(--grad)}
.switch input:checked+.sl::before{transform:translateX(20px)}
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff}
.switch-row span{font-size:13.5px}
.cover-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cover-preview{width:74px;height:74px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;flex-shrink:0}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px;max-width:320px}
.emoji-grid button{border:none;background:transparent;font-size:20px;padding:5px;border-radius:8px}
.emoji-grid button:hover{background:rgba(91,110,245,.1)}
.tag-input{display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;min-height:44px;align-items:center;cursor:text}
.tag-input.focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,110,245,.12)}
.tag-input .tg{display:inline-flex;align-items:center;gap:5px;background:rgba(91,110,245,.1);color:var(--primary);font-size:12.5px;padding:3px 9px;border-radius:14px;font-weight:600}
.tag-input .tg b{cursor:pointer;font-weight:400}
.tag-input .tg b:hover{color:var(--danger)}
.tag-input input{border:none;flex:1;min-width:100px;padding:3px 2px;font-size:13px}
.editor-foot{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}

/* ===== 设置 ===== */
.social-row{display:flex;gap:10px;margin-bottom:10px}
.social-row input{padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;background:#fff}

/* ===== 通用组件 ===== */
.toast-box{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 12px 34px rgba(43,47,58,.2);font-size:13.5px;font-weight:500;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{border-left:4px solid var(--success)}
.toast.err{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.modal-mask{position:fixed;inset:0;background:rgba(24,26,40,.5);backdrop-filter:blur(3px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:toastIn .25s}
.modal h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal p{font-size:13.5px;color:var(--text-2);line-height:1.8;margin-bottom:20px;word-break:break-all}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end}
.empty{padding:60px 0;text-align:center;color:var(--text-3)}
.empty .e{font-size:44px;margin-bottom:10px}
.skeleton{padding:40px;text-align:center;color:var(--text-3)}
.overlay{position:fixed;inset:0;background:rgba(244,245,249,.88);backdrop-filter:blur(6px);z-index:800;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid rgba(91,110,245,.15);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:13px;color:var(--text-2)}

/* ===== Markdown 渲染（与前台一致） ===== */
.md{font-size:14.5px;color:#373c4a;line-height:1.8}
.md h1,.md h2,.md h3,.md h4{margin:1.3em 0 .6em;font-weight:700}
.md h1{font-size:21px;padding-left:12px;border-left:4px solid var(--primary)}
.md h2{font-size:18px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.md h3{font-size:16px}
.md p{margin:.7em 0}
.md a{color:var(--primary)}
.md ul,.md ol{margin:.7em 0;padding-left:1.6em}
.md li{margin:.3em 0}
.md blockquote{margin:.9em 0;padding:10px 16px;background:rgba(91,110,245,.06);border-left:4px solid var(--primary);border-radius:0 10px 10px 0;color:var(--text-2)}
.md code:not(pre code){background:rgba(91,110,245,.09);color:#4c5195;padding:2px 6px;border-radius:5px;font-size:87%;font-family:var(--mono)}
.md pre{background:#23263b;color:#e6e9f5;border-radius:11px;padding:15px 17px;overflow-x:auto;margin:.9em 0;font-size:13px;line-height:1.65}
.md pre code{font-family:var(--mono)}
.md table{width:100%;border-collapse:collapse;margin:.9em 0;font-size:13px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.md th{background:var(--grad);color:#fff}
.md th,.md td{padding:9px 13px;text-align:left}
.md tr:nth-child(even) td{background:#f8f9fd}
.md hr{border:none;height:1px;background:var(--border);margin:1.5em 0}
.md img{max-width:100%;border-radius:9px}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-area{margin-left:0}
  .overlay-menu{display:block;position:fixed;top:14px;left:14px;z-index:60;width:42px;height:42px;border-radius:11px;border:none;background:var(--side-bg);color:#fff;font-size:17px}
  .content{padding:18px 14px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2{grid-column:span 1}
  .emoji-grid{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>

<div class="toast-box" id="toastBox"></div>
<div id="root"></div>

<script>
/* ================= 基础工具 ================= */
const $=s=>document.querySelector(s);
const root=document.getElementById('root');
const GRADS=[['#6366f1','#8b5cf6'],['#06b6d4','#3b82f6'],['#a78bfa','#7c3aed'],['#5b6ef5','#8b5cf6'],['#f59e0b','#f97316'],['#10b981','#14b8a6'],['#0ea5e9','#22d3ee'],['#84cc16','#22c55e']];
function hashStr(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))>>>0;return h}
function gradOf(k){const g=GRADS[hashStr(k)%GRADS.length];return 'linear-gradient(135deg,'+g[0]+','+g[1]+')'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '-';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast '+(type||'info');
  t.innerHTML=(type==='ok'?'✅ ':type==='err'?'⚠️ ':'💡 ')+esc(msg);
  $('#toastBox').appendChild(t);
  setTimeout(()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateY(-12px)';setTimeout(()=>t.remove(),320)},3200);
}
function confirmBox(title,text){
  return new Promise(res=>{
    const mask=document.createElement('div');
    mask.className='modal-mask';

/* base64 UTF-8 */
function b64enc(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ================= Markdown ================= */
function inlineMd(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s;
}
function mdToHtml(src){
  if(!src)return '';
  const codeBlocks=[];
  src=String(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{codeBlocks.push(c);return '\u0001CB'+(codeBlocks.length-1)+'\u0001'});
  const lines=src.split('\n');
  let html='',inUl=false,inOl=false,inQ=false,inT=false,trs=[];
  const closeList=()=>{if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}};
  const closeQ=()=>{if(inQ){html+='</blockquote>';inQ=false}};
  const closeT=()=>{if(!inT)return;let t='<table><thead><tr>';trs[0].forEach(c=>t+='<th>'+inlineMd(c)+'</th>');t+='</tr></thead><tbody>';for(let i=1;i<trs.length;i++){t+='<tr>';trs[i].forEach(c=>t+='<td>'+inlineMd(c)+'</td>');t+='</tr>'}t+='</tbody></table>';html+=t;inT=false;trs=[]};
  let para=[];const flushP=()=>{if(para.length)html+='<p>'+inlineMd(para.join(' '))+'</p>';para=[]};
  for(const line of lines){
    const cb=line.match(/^\u0001CB(\d+)\u0001\s*$/);
    if(cb){flushP();closeList();closeQ();closeT();html+='<pre><code>'+esc(codeBlocks[+cb[1]].replace(/\n$/,''))+'</code></pre>';continue}
    if(/^\s*$/.test(line)){flushP();closeList();closeQ();closeT();continue}
    if(/^\|(.+)\|\s*$/.test(line)){
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      if(!inT){flushP();closeList();closeQ();inT=true;trs=[]}
      trs.push(cells);continue;
    }else closeT();
    const h=line.match(/^(#{1,4})\s+(.*)/);
    if(h){flushP();closeList();closeQ();html+='<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>';continue}
    if(/^>\s?/.test(line)){flushP();closeList();if(!inQ){html+='<blockquote>';inQ=true}html+='<p>'+inlineMd(line.replace(/^>\s?/,''))+'</p>';continue}
    closeQ();
    if(/^[-*]\s+/.test(line)){flushP();if(inOl){html+='</ol>';inOl=false}if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}
    if(/^\d+\.\s+/.test(line)){flushP();if(inUl){html+='</ul>';inUl=false}if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inlineMd(line.replace(/^\d+\.\s+/,''))+'</li>';continue}
    if(/^(---|\*\*\*)\s*$/.test(line)){flushP();closeList();html+='<hr>';continue}
    closeList();para.push(line.trim());
  }
  flushP();closeList();closeQ();closeT();
  return html;
}

/* ================= GitHub API 层 ================= */
const AUTH_KEY='blog_admin_auth_v1';
let AUTH=null;      // {owner,repo,token}
let DATA=null;      // 当前数据
let SHA=null;       // data.json 的 git blob sha

function ghHeaders(){
  return {
    'Authorization':'Bearer '+AUTH.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
    'Content-Type':'application/json'
  };
}
async function ghFetch(url,options){
  const res=await fetch(url,{...options,headers:ghHeaders()});
  if(res.status===401)throw new Error('令牌无效或已过期（401），请重新生成并登录');
  if(res.status===403){
    const body=await res.json().catch(()=>({}));
    throw new Error(body.message||'无权限（403），请检查令牌是否授予该仓库 Contents 读写权限');
  }
  if(res.status===404)throw new Error('404：仓库不存在，或令牌无权访问该仓库');
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    throw new Error((body&&body.message)||('请求失败 HTTP '+res.status));
  }
  return res.json();
}
async function apiLoadData(){
  const j=await ghFetch('https://api.github.com/repos/'+AUTH.owner+'/'+AUTH.repo+'/contents/data.json');
  SHA=j.sha;
  DATA=JSON.parse(b64dec(j.content));
  delete DATA.messages; // 留言板功能已移除，保存时不再写入该字段
}
async function apiSaveData(message){
  const body={
    message:message||'更新站点数据',
    content:b64enc(JSON.stringify(DATA,null,2))
  };
  if(SHA)body.sha=SHA;
  try{
    const j=await ghFetch('https://api.github.com/repos/'+AUTH.owner+'/'+AUTH.repo+'/contents/data.json',{
      method:'PUT',body:JSON.stringify(body)
    });
    SHA=j.content.sha;
    return true;
  }catch(e){
    if(/409|sha/i.test(e.message)){
      // 冲突：重新拉取最新 sha 后重试一次
      await apiLoadData();
      body.sha=SHA;
      const j=await ghFetch('https://api.github.com/repos/'+AUTH.owner+'/'+AUTH.repo+'/contents/data.json',{
        method:'PUT',body:JSON.stringify(body)
      });
      SHA=j.content.sha;
      return true;
    }
    throw e;
  }
}
async function saveData(msg){
  busy(true,'正在通过 API 提交到 GitHub…');
  try{
    await apiSaveData(msg);
    toast('已保存！站点约 1 分钟后自动更新（Pages 重新部署）','ok');
    return true;
  }catch(e){
    toast('保存失败：'+e.message,'err');
    return false;
  }finally{busy(false)}
}

  c.addEventListener('click',async e=>{
    const ed=e.target.closest('[data-edit]');
    if(ed){viewArticleEditor(ed.dataset.edit);return}
    const tg=e.target.closest('[data-toggle]');
    if(tg){
      const a=DATA.articles.find(x=>x.id===tg.dataset.toggle);
      if(a){a.published=a.published===false;a.updatedAt=today();if(await saveData((a.published?'发布':'转草稿')+'文章《'+a.title+'》'))refresh()}
      return;
    }
    const dl=e.target.closest('[data-del]');
    if(dl){
      const a=DATA.articles.find(x=>x.id===dl.dataset.del);
      if(a&&await confirmBox('删除文章','将永久删除《'+a.title+'》，此操作会提交到 GitHub，确定吗？')){
        DATA.articles=DATA.articles.filter(x=>x.id!==a.id);
        if(await saveData('删除文章《'+a.title+'》'))refresh();
      }
    }
  });
}

/* ===== 文章编辑器 ===== */
const EMOJIS=['📄','🎉','🚀','🎨','🌏','✍️','📅','⚡','🧩','💻','📚','🌿','🧰','🔧','💡','🔥','⭐','🌈','🎧','🎮','📷','🍜','🐱','🐶','🌻','🌊','🏔️','🎈','🎁','🏆','🎯','🌙','☀️','🍀','🦄','🐧','🐳','🍩','☕','🧁'];
function viewArticleEditor(id){
  const a=id?DATA.articles.find(x=>x.id===id):null;
  const isNew=!a;
  const editing=a||{id:uid('a'),title:'',cover:'📄',summary:'',content:'',categoryId:'',tagIds:[],views:0,published:true,featured:false,createdAt:today(),updatedAt:today()};
  let emojiOpen=false,showPreview=false;
  const content=$('#content');
  $('#pageTitle').textContent=isNew?'新建文章':'编辑文章';
  content.innerHTML=`
  <div class="editor-wrap">
    <button class="btn btn-sm" id="backBtn" style="margin-bottom:16px">← 返回列表</button>
    <div class="panel"><div class="panel-body">
      <div class="form-grid">
        <div class="field span2"><label>文章标题 <span class="req">*</span></label>
          <input id="fTitle" value="${esc(editing.title)}" placeholder="给文章起个响亮的名字" maxlength="80"></div>
        <div class="field"><label>封面 emoji</label>
          <div class="cover-pick">
            <div class="cover-preview" id="coverPrev" style="background:${gradOf(editing.id)}">${esc(editing.cover||'📄')}</div>
            <div>
              <button class="btn btn-sm" id="emojiBtn" type="button">😀 选择图标</button>
              <div class="emoji-grid" id="emojiGrid" style="display:none;margin-top:8px">${EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('')}</div>
            </div>
          </div></div>
        <div class="field"><label>所属分类</label>
          <select id="fCat"><option value="">未分类</option>${(DATA.categories||[]).map(x=>`<option value="${x.id}" ${editing.categoryId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
        <div class="field span2"><label>标签 <span style="color:var(--text-3);font-weight:400">（输入后回车添加，点击 × 移除）</span></label>
          <div class="tag-input" id="tagBox"><input id="tagInput" placeholder="输入标签名，回车确认"></div></div>
        <div class="field span2"><label>摘要</label>
          <textarea id="fSummary" rows="2" maxlength="160" placeholder="显示在文章卡片上的一段简介（建议 60 字内）">${esc(editing.summary)}</textarea></div>
        <div class="field span2"><label>正文（Markdown）</label>
          <div class="md-toolbar">
            <button class="mt-btn" data-md="bold">B 加粗</button>
            <button class="mt-btn" data-md="italic">I 斜体</button>
            <button class="mt-btn" data-md="h2">H 标题</button>
            <button class="mt-btn" data-md="list">• 列表</button>
            <button class="mt-btn" data-md="quote">❝ 引用</button>
            <button class="mt-btn" data-md="code">‹› 代码</button>
            <button class="mt-btn" data-md="codeblock">▤ 代码块</button>
            <button class="mt-btn" data-md="link">🔗 链接</button>
            <button class="mt-btn" id="pvBtn" style="margin-left:auto">👁 ${showPreview?'关闭预览':'实时预览'}</button>
          </div>
          <div class="md-editor">
            <textarea id="fContent" spellcheck="false" placeholder="# 在这里用 Markdown 写作…&#10;&#10;支持标题、列表、引用、代码块、表格、链接等语法">${esc(editing.content)}</textarea>
          </div>
          <div class="md-preview md" id="mdPreview" style="display:none;margin-top:12px"></div>
        </div>
        <div class="field"><label>发布状态</label>
          <div class="switch-row"><label class="switch"><input type="checkbox" id="fPub" ${editing.published!==false?'checked':''}><span class="sl"></span></label><span>公开发布（关闭则存为草稿）</span></div></div>
        <div class="field"><label>精选推荐</label>
          <div class="switch-row"><label class="switch"><input type="checkbox" id="fFeat" ${editing.featured?'checked':''}><span class="sl"></span></label><span>显示在首页轮播位</span></div></div>
      </div>
      <div class="editor-foot">
        <button class="btn" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveArtBtn">💾 ${isNew?'创建文章':'保存修改'}</button>
      </div>
    </div></div>
  </div>`;
  let tagIds=[...(editing.tagIds||[])];
  const drawTags=()=>{
    const box=$('#tagBox');
    box.querySelectorAll('.tg').forEach(x=>x.remove());
    const input=$('#tagInput');
    tagIds.forEach(tid=>{
      const t=byIdTag(tid);if(!t)return;
      const chip=document.createElement('span');
      chip.className='tg';chip.innerHTML='# '+esc(t.name)+' <b title="移除">×</b>';
      chip.querySelector('b').addEventListener('click',()=>{tagIds=tagIds.filter(x=>x!==tid);drawTags()});
      box.insertBefore(chip,input);
    });
  };
  drawTags();
  const addTag=raw=>{
    const name=raw.trim();if(!name)return;
    let t=(DATA.tags||[]).find(x=>x.name===name);
    if(!t){t={id:uid('t'),name};DATA.tags.push(t)}
    if(!tagIds.includes(t.id)){tagIds.push(t.id);drawTags()}
    $('#tagInput').value='';
  };
  $('#tagInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(e.target.value)}
  });
  $('#tagBox').addEventListener('click',()=>$('#tagInput').focus());
  $('#tagBox').addEventListener('focusin',()=>$('#tagBox').classList.add('focus'));
  $('#tagBox').addEventListener('focusout',()=>$('#tagBox').classList.remove('focus'));
  $('#emojiBtn').addEventListener('click',()=>{emojiOpen=!emojiOpen;$('#emojiGrid').style.display=emojiOpen?'grid':'none'});
  $('#emojiGrid').addEventListener('click',e=>{
    const b=e.target.closest('[data-e]');if(!b)return;
    $('#coverPrev').textContent=b.dataset.e;emojiOpen=false;$('#emojiGrid').style.display='none';
  });
  $('#fTitle').addEventListener('input',()=>$('#coverPrev').style.background=gradOf(editing.id+$('#fTitle').value));
  const ta=$('#fContent');
  const doPreview=()=>{$('#mdPreview').innerHTML=mdToHtml(ta.value)||'<p style="color:var(--text-3)">开始输入即可看到预览…</p>'};
  $('#pvBtn').addEventListener('click',()=>{
    showPreview=!showPreview;
    $('#mdPreview').style.display=showPreview?'block':'none';
    $('#pvBtn').textContent=showPreview?'👁 关闭预览':'👁 实时预览';
    if(showPreview)doPreview();
  });
  ta.addEventListener('input',()=>{if(showPreview)doPreview()});
  const MD_INS={
    bold:{wrap:'**'},
    italic:{wrap:'*'},
    code:{wrap:'`'},
    h2:{pre:'## '},
    list:{pre:'- '},
    quote:{pre:'> '},
    link:{wrap:'[',post:'](https://)',ph:'链接文字'},
    codeblock:{pre:'\n```\n',post:'\n```\n',ph:'代码'}
  };
  content.querySelectorAll('.mt-btn[data-md]').forEach(b=>b.addEventListener('click',()=>{
    const spec=MD_INS[b.dataset.md];if(!spec)return;
    const start=ta.selectionStart,end=ta.selectionEnd,sel=ta.value.slice(start,end);
    let insert;
    if(spec.wrap&&spec.post)insert=spec.wrap+(sel||spec.ph)+spec.post;
    else if(spec.wrap)insert=spec.wrap+(sel||spec.ph||'文字')+spec.wrap;
    else if(spec.post)insert=spec.pre+(sel||spec.ph)+spec.post;
    else insert=spec.pre+(sel||'');
    ta.setRangeText(insert,start,end,'end');
    ta.focus();
    if(showPreview)doPreview();
  }));
  $('#backBtn').addEventListener('click',()=>{$('#pageTitle').textContent=TITLES.articles;viewArticles($('#content'))});
  $('#cancelBtn').addEventListener('click',()=>{
    if(confirm('确定放弃当前编辑的内容吗？（未保存的修改将丢失）')){$('#pageTitle').textContent=TITLES.articles;viewArticles($('#content'))}
  });
  $('#saveArtBtn').addEventListener('click',async()=>{
    const title=$('#fTitle').value.trim();
    if(!title){toast('请填写文章标题','err');$('#fTitle').focus();return}
    const obj={
      id:editing.id,
      title,
      cover:$('#coverPrev').textContent.trim()||'📄',
      summary:$('#fSummary').value.trim(),
      content:ta.value,
      categoryId:$('#fCat').value,
      tagIds,
      views:editing.views||0,
      published:$('#fPub').checked,
      featured:$('#fFeat').checked,
      createdAt:editing.createdAt||today(),
      updatedAt:today()
    };
    if(isNew)DATA.articles.push(obj);
    else{const i=DATA.articles.findIndex(x=>x.id===editing.id);DATA.articles[i]=obj}
    if(await saveData((isNew?'新建':'更新')+'文章《'+title+'》')){
      $('#pageTitle').textContent=TITLES.articles;viewArticles($('#content'));
    }
  });
}

/* ===== 分类 / 标签管理 ===== */
function viewTaxonomy(c,type){
  const isCat=type==='categories';
  const list=DATA[type]||[];
  const arts=DATA.articles||[];
  const label=isCat?'分类':'标签';
  c.innerHTML=`
  <div class="editor-wrap">
    <div class="table-toolbar">
      <div style="flex:1"></div>
      <input id="taxNew" placeholder="新${label}名称，回车添加" style="padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;width:240px">
      <button class="btn btn-primary" id="taxAddBtn">＋ 添加${label}</button>
    </div>
    <div class="panel"><div class="table-wrap">
      <table class="dt"><thead><tr><th style="width:60px">图标</th><th>名称</th><th>关联文章</th><th style="width:180px">操作</th></tr></thead>
      <tbody>${list.map(x=>{
        const count=arts.filter(a=>isCat?a.categoryId===x.id:(a.tagIds||[]).includes(x.id)).length;
        return `<tr>
          <td><div class="t-cover" style="background:${gradOf(x.id)}">${isCat?'🗂️':'🏷️'}</div></td>
          <td><b>${esc(x.name)}</b></td>
          <td>${count} 篇${count?'':' <span style="color:var(--text-3);font-size:12px">(空)</span>'}</td>
          <td><div class="row-actions">
            <button class="btn btn-sm" data-ren="${x.id}">✏️ 重命名</button>
            <button class="icon-btn del" title="删除" data-del="${x.id}">🗑️</button>
          </div></td></tr>`;
      }).join('')||`<tr><td colspan="4"><div class="empty"><div class="e">🍃</div>还没有${label}，右上角添加一个</div></td></tr>`}</tbody></table>
    </div></div>
  </div>`;
  const add=async()=>{
    const name=$('#taxNew').value.trim();
    if(!name){toast('请输入名称','err');return}
    if(list.some(x=>x.name===name)){toast('该'+label+'已存在','err');return}
    DATA[type].push({id:uid(isCat?'c':'t'),name});
    if(await saveData('添加'+label+'「'+name+'」'))viewTaxonomy($('#content'),type);
  };
  $('#taxAddBtn').addEventListener('click',add);
  $('#taxNew').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  c.addEventListener('click',async e=>{
    const rn=e.target.closest('[data-ren]');
    if(rn){
      const x=DATA[type].find(y=>y.id===rn.dataset.ren);
      const name=prompt('重命名「'+x.name+'」为：',x.name);
      if(name&&name.trim()&&name.trim()!==x.name){
        x.name=name.trim();
        if(await saveData('重命名'+label+'为「'+x.name+'」'))viewTaxonomy($('#content'),type);
      }
      return;
    }
    const dl=e.target.closest('[data-del]');
    if(dl){
      const x=DATA[type].find(y=>y.id===dl.dataset.del);
      const count=arts.filter(a=>isCat?a.categoryId===x.id:(a.tagIds||[]).includes(x.id)).length;
      if(!await confirmBox('删除'+label,'确定删除「'+x.name+'」吗？'+(count?'有 '+count+' 篇文章关联它，删除后这些文章将失去该'+label+'。':'')))return;
      DATA[type]=DATA[type].filter(y=>y.id!==x.id);
      if(isCat)DATA.articles.forEach(a=>{if(a.categoryId===x.id)a.categoryId=''});
      else DATA.articles.forEach(a=>{a.tagIds=(a.tagIds||[]).filter(t=>t!==x.id)});
      if(await saveData('删除'+label+'「'+x.name+'」'))viewTaxonomy($('#content'),type);
    }
  });
}

/* ===== 站点设置 ===== */
function viewSettings(c){
  const s=DATA.site||{};
  c.innerHTML=`
  <div class="editor-wrap">
    <div class="panel"><div class="panel-head">⚙️ 站点基础信息</div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>站点名称 <span class="req">*</span></label><input id="sTitle" value="${esc(s.title||'')}" maxlength="30"></div>
          <div class="field"><label>建站年份</label><input id="sSince" type="number" value="${esc(s.since||new Date().getFullYear())}" min="2000" max="2100"></div>
          <div class="field span2"><label>站点副标题</label><input id="sSub" value="${esc(s.subtitle||'')}" maxlength="60" placeholder="显示在首页打字机位置"></div>
          <div class="field"><label>头像 emoji</label>
            <div class="cover-pick"><div class="cover-preview" id="sAvaPrev" style="width:52px;height:52px;font-size:${(s.avatar||'超能宝宝').length>2?13:26}px;color:#fff;font-weight:800;line-height:1;background:${gradOf('site')}">${esc(s.avatar||'超能宝宝')}</div>
            <button class="btn btn-sm" id="sEmojiBtn" type="button">😀 选择</button>
            <div class="emoji-grid" id="sEmojiGrid" style="display:none">${EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('')}</div></div></div>
          <div class="field"><label>个性签名</label><input id="sSign" value="${esc(s.signature||'')}" maxlength="40"></div>
          <div class="field span2"><label>页脚文案</label><input id="sFooter" value="${esc(s.footer||'')}" maxlength="40"></div>
        </div>
      </div>
    </div>
    <div class="panel"><div class="panel-head">🔗 社交链接</div>
      <div class="panel-body">
        <div id="socialRows"></div>
        <button class="btn btn-sm" id="addSocialBtn">＋ 添加链接</button>
        <p class="hint" style="margin-top:10px;color:var(--text-3);font-size:12.5px">链接格式：名称 + 完整地址（如 https://github.com/xxx 或 mailto:xxx@xx.com）</p>
      </div>
    </div>
    <div class="editor-foot" style="padding-bottom:30px">
      <button class="btn btn-primary" id="saveSettingBtn" style="padding:11px 34px">💾 保存站点设置</button>
    </div>
  </div>`;
  let ava=s.avatar||'超能宝宝';
  $('#sEmojiBtn').addEventListener('click',()=>{const g=$('#sEmojiGrid');g.style.display=g.style.display==='none'?'grid':'none'});
  $('#sEmojiGrid').addEventListener('click',e=>{
    const b=e.target.closest('[data-e]');if(!b)return;
    ava=b.dataset.e;const p=$('#sAvaPrev');p.textContent=ava;p.style.fontSize='26px';$('#sEmojiGrid').style.display='none';
  });
  const socials=[...(s.socials||[])];
  const drawSocials=()=>{
    $('#socialRows').innerHTML=socials.map((so,i)=>`
      <div class="social-row">
        <input data-si="${i}" data-f="name" value="${esc(so.name)}" placeholder="名称" style="flex:0 0 130px">
        <input data-si="${i}" data-f="url" value="${esc(so.url)}" placeholder="https://…">
        <button class="icon-btn del" data-sdel="${i}" title="移除">🗑️</button>
      </div>`).join('')||'<p style="color:var(--text-3);font-size:13px;margin-bottom:10px">暂无链接</p>';
  };
  drawSocials();
  $('#socialRows').addEventListener('input',e=>{
    const inp=e.target.closest('[data-si]');if(!inp)return;
    socials[+inp.dataset.si][inp.dataset.f]=inp.value;
  });
  $('#socialRows').addEventListener('click',e=>{
    const dl=e.target.closest('[data-sdel]');
    if(dl){socials.splice(+dl.dataset.sdel,1);drawSocials()}
  });
  $('#addSocialBtn').addEventListener('click',()=>{socials.push({name:'',url:''});drawSocials()});
  $('#saveSettingBtn').addEventListener('click',async()=>{
    const title=$('#sTitle').value.trim();
    if(!title){toast('站点名称不能为空','err');return}
    DATA.site={
      title,
      subtitle:$('#sSub').value.trim(),
      avatar:ava,
      signature:$('#sSign').value.trim(),
      footer:$('#sFooter').value.trim(),
      since:+$('#sSince').value||new Date().getFullYear(),
      socials:socials.filter(x=>x.name.trim()&&x.url.trim())
    };
    if(await saveData('更新站点设置')){
      document.title='管理后台 - '+title;
      renderApp();
      CUR='settings';drawMenu();$('#pageTitle').textContent=TITLES.settings;renderView();
    }
  });
}

/* ================= 启动 ================= */
(function init(){
  try{
    const saved=localStorage.getItem(AUTH_KEY);
    const prefill=saved?JSON.parse(saved):null;
    if(prefill&&prefill.token){
      (async()=>{
        AUTH=prefill;
        busy(true,'正在恢复登录…');
        try{
          await apiLoadData();
          toast('已自动登录 '+AUTH.owner,'ok');
          renderApp();return;
        }catch(e){
          if(!/401|令牌/.test(e.message)){toast(e.message,'err')}
          AUTH=null;
        }finally{busy(false)}
        renderLogin(prefill);
      })();
      return;
    }
    renderLogin(prefill);
  }catch(e){renderLogin()}
})();
</script>
